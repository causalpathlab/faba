name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep CI output readable and builds reproducible.
  RUST_BACKTRACE: 1

jobs:
  # Both fmt and clippy are PINNED, not floating on `stable`, and pinned to
  # 1.94 -- the toolchain this crate is actually developed on. A new
  # rustfmt can reformat code it used to accept and a new clippy can add
  # lints, so `--check` / `-D warnings` on a floating toolchain turns main
  # red with no code change. Pinning to the local toolchain means CI
  # reproduces exactly what `cargo clippy` shows you before you push.
  # Bumping the pin is then a deliberate PR that carries the new version's
  # lint fixes with it.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-deps
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets so test and bench code is linted too.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # Optional HDF5 feature: a plain build never touches `#[cfg(feature =
  # "hdf5")]` paths, so they can rot. This is the one optional feature a
  # hosted runner can satisfy.
  features:
    name: check --features hdf5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-deps
        with:
          hdf5: 'true'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --features hdf5

  # `rust-version` is the highest `rust-version` among resolved dependencies
  # (1.91, from the zarrs stack via data-beans). That is the floor the
  # dependency graph imposes; this job checks whether this crate's own
  # sources also build there. Non-blocking until it has gone green once --
  # then delete `continue-on-error` to make it a gate.
  msrv:
    name: MSRV (discovery, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/system-deps
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
