name: System dependencies
description: >
  Install the C libraries this crate links against. Kept in one place so
  every job agrees on the list. Sets SYSTEM_DEPS, a fingerprint of the
  versions installed, for the build caches' keys: build scripts (bindgen,
  hdf5-metno-sys) read these libraries' headers once and are not rerun when
  only the runner's libraries change, so a cache built against others would
  link against the wrong ones.

inputs:
  hdf5:
    description: Also install libhdf5-dev (only the `hdf5` feature needs it).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update

        # Why each of these:
        #   libopenblas-dev  legume-numeric / ndarray may pull BLAS linkage
        #                    with no blas-src in the graph, so the host must
        #                    provide it or the link fails.
        #   rust-htslib      needs clang/libclang for bindgen plus the codec
        #                    libraries htslib itself links (z, bz2, lzma) and
        #                    curl/ssl for remote CRAM/BAM.
        #   libz-sys         data-beans links zlib directly.
        packages=(
          build-essential pkg-config cmake
          clang libclang-dev
          libopenblas-dev
          zlib1g-dev libbz2-dev liblzma-dev
          libcurl4-openssl-dev libssl-dev
        )
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
        printf '%s\n' "${packages[@]}" > "$RUNNER_TEMP/system-deps.txt"

    - shell: bash
      if: inputs.hdf5 == 'true'
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends libhdf5-dev
        echo libhdf5-dev >> "$RUNNER_TEMP/system-deps.txt"
        # Debian splits HDF5 across prefixes, so HDF5_DIR can't be set to one
        # directory. hdf5-metno-sys finds it via pkg-config instead.
        pkg-config --exists hdf5-serial || pkg-config --exists hdf5

    - shell: bash
      run: |
        set -euo pipefail
        # The installed versions of every package above, hashed: a cache key
        # part that changes when the runner's libraries do.
        fingerprint=$(xargs dpkg-query -W -f='${Package}=${Version}\n' \
          < "$RUNNER_TEMP/system-deps.txt" | sort | sha256sum | cut -c1-16)
        echo "SYSTEM_DEPS=$fingerprint" >> "$GITHUB_ENV"
        echo "system libraries: $fingerprint"
